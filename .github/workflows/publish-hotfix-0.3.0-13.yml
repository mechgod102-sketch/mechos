name: Publish MechOS v0.3.0 Hotfix 13

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-hotfix-0.3.0-13.sh'
      - 'scripts/mechos-hotfix-0.3.0-13-apply.sh'
      - 'scripts/mechos-hotfix13-mechscope-patch.py'
      - 'scripts/mechos-hotfix13-stability-integration.sh'
      - 'scripts/mechos-game-install-controller-v13.py'
      - 'scripts/mechos-performance-center-v13.py'
      - 'scripts/mechos-update-helper-v13-patch.py'
      - 'scripts/mechos-update-transaction-v13.sh'
      - 'scripts/validate-hotfix-0.3.0-13.sh'
      - '.github/workflows/publish-hotfix-0.3.0-13.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-13-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate Hotfix 13
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-13.sh
          bash scripts/build-hotfix-0.3.0-13.sh
      - name: Publish Hotfix 13 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.13-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.13-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 13 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 13'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 13 after three synchronized attempts.' >&2
          exit 1
