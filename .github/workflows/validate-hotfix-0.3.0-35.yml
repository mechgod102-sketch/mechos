name: Validate MechOS Hotfix 35

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mechos-unified-store-v35.py'
      - 'scripts/mechos-launcher-bootstrap-v35.sh'
      - 'scripts/mechos-hotfix35-store-route-patch.py'
      - 'scripts/mechos-hotfix-0.3.0-35-apply.sh'
      - 'scripts/build-hotfix-0.3.0-35.sh'
      - 'scripts/validate-hotfix-0.3.0-35.sh'
      - '.github/workflows/validate-hotfix-0.3.0-35.yml'
      - '.github/workflows/publish-hotfix-35.yml'
  push:
    branches:
      - 'hotfix/0.3.0-35-unified-store-routing'

permissions:
  contents: read

concurrency:
  group: validate-mechos-hotfix-35-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hotfix-35:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Validate Hotfix 35 source contracts
        run: bash scripts/validate-hotfix-0.3.0-35.sh
      - name: Build cumulative Hotfix 35 bundle
        run: bash scripts/build-hotfix-0.3.0-35.sh
      - name: Validate Hotfix 35 bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.0-hotfix.35-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.0-hotfix.35-update.tar.zst.sha256)
          rm -rf /tmp/hf35-check && mkdir -p /tmp/hf35-check
          tar --zstd -xpf "$B" -C /tmp/hf35-check
          test -x /tmp/hf35-check/usr/local/bin/mechos-unified-store
          test -x /tmp/hf35-check/usr/local/libexec/mechos-launcher-bootstrap-v35
          test -x /tmp/hf35-check/usr/local/libexec/mechos-hotfix35-store-route-patch
          test -x /tmp/hf35-check/usr/local/libexec/mechos-hotfix-0.3.0-35-apply
          test -f /tmp/hf35-check/usr/local/libexec/mechos-mechscope-source-runtime-v33
          grep -Fq 'MECHOS_UNIFIED_STORE_V35' /tmp/hf35-check/usr/local/bin/mechos-unified-store
          grep -Fq 'MECHOS_LAUNCHER_BOOTSTRAP_V35' /tmp/hf35-check/usr/local/libexec/mechos-launcher-bootstrap-v35
          grep -Fq 'MECHOS_MECHSCOPE_UNIFIED_STORE_ROUTE_V35' /tmp/hf35-check/usr/local/libexec/mechos-mechscope-source-runtime-v33
          grep -Fq 'MECHOS_MECHSCOPE_RESPONSIVE_UI_V34' /tmp/hf35-check/usr/local/share/mechos/mechscope/mechscope_shell.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path('updates/bundles/MechOS-0.3.0-hotfix.35-update.tar.zst')
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['channel']=='stable'
          assert d['version']=='0.3.0-hotfix.35'
          assert d['requires_reboot'] is True
          assert hashlib.sha256(b.read_bytes()).hexdigest()==d['bundle_sha256']
          PY
