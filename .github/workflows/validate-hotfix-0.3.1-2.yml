name: Validate MechOS 0.3.1 Hotfix 2

on:
  pull_request:
    paths:
      - 'scripts/mechos-update-self-repair-v0312.sh'
      - 'scripts/mechos-update-center-rescue-launcher-v0312.sh'
      - 'scripts/mechos-hotfix-0.3.1-2-apply.sh'
      - 'scripts/mechos-update-center-reference-v8.py'
      - 'scripts/mechos-update-transaction-v14.sh'
      - 'scripts/build-hotfix-0.3.1-2.sh'
      - 'scripts/validate-hotfix-0.3.1-2.sh'
      - 'docs/RELEASE-NOTES-0.3.1-hotfix.2.md'
      - '.github/workflows/validate-hotfix-0.3.1-2.yml'
      - '.github/workflows/publish-hotfix-0.3.1-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hotfix-0-3-1-2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd openssl
      - name: Validate self-repair source and scenarios
        run: bash scripts/validate-hotfix-0.3.1-2.sh
      - name: Build cumulative Hotfix 2 bundle
        run: bash scripts/build-hotfix-0.3.1-2.sh
      - name: Verify built bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.1-hotfix.2-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.1-hotfix.2-update.tar.zst.sha256)
          CONTENTS="$(tar --zstd -tf "$B")"
          for member in             './usr/local/bin/mechos-update-helper'             './usr/local/bin/mechos-update-center'             './usr/local/bin/mechos-reboot'             './usr/local/libexec/mechos-update-center-v8.py'             './usr/local/libexec/mechos-update-transaction-v14'             './usr/local/libexec/mechos-update-self-repair-v0312'             './usr/local/share/mechos/update-recovery/mechos-update-helper-v37.sh'             './usr/local/share/mechos/update-recovery/mechos-update-center'             './usr/local/share/mechos/update-recovery/mechos-update-center-v8.py'             './usr/local/share/mechos/update-recovery/mechos-reboot'             './usr/local/share/mechos/update-recovery/mechos-update-signing-public.pem'             './usr/lib/systemd/system/mechos-update-self-repair.service'             './usr/lib/systemd/system/mechos-hotfix-0.3.1-2.service'; do
            grep -Fxq "$member" <<<"$CONTENTS"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['version']=='0.3.1-hotfix.2'
          assert d['release_name']=='MechOS v0.3.1 Hotfix 2'
          assert d['signature_url'].endswith('/updates/stable.json.sig')
          assert d['requires_reboot'] is True
          PY
