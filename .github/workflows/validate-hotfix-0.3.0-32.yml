name: Validate MechOS Hotfix 32

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mechscope-session-v20.sh'
      - 'scripts/mechos-mechscope-safe-launch-v31.sh'
      - 'scripts/mechos-session-autostart-v31.sh'
      - 'scripts/mechos-hotfix-0.3.0-32-apply.sh'
      - 'scripts/build-hotfix-0.3.0-32.sh'
      - 'scripts/validate-hotfix-0.3.0-32.sh'
      - '.github/workflows/validate-hotfix-0.3.0-32.yml'
      - '.github/workflows/publish-hotfix-32.yml'
  push:
    branches:
      - 'hotfix/0.3.0-32-single-mechscope-owner'

permissions:
  contents: read

concurrency:
  group: validate-mechos-hotfix-32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hotfix-32:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd util-linux
      - name: Validate Hotfix 32 source contracts
        run: bash scripts/validate-hotfix-0.3.0-32.sh
      - name: Build cumulative Hotfix 32 bundle
        run: bash scripts/build-hotfix-0.3.0-32.sh
      - name: Validate Hotfix 32 bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.0-hotfix.32-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.0-hotfix.32-update.tar.zst.sha256)
          CONTENTS="$(tar --zstd -tf "$B")"
          grep -Fxq './usr/local/bin/mechscope-session' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-mechscope-safe-launch-v31' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-session-autostart-v31' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-32-apply' <<<"$CONTENTS"
          grep -Fxq './usr/lib/systemd/system/mechos-hotfix-0.3.0-32.service' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-31-apply' <<<"$CONTENTS"
          rm -rf /tmp/hf32-check && mkdir -p /tmp/hf32-check
          tar --zstd -xpf "$B" -C /tmp/hf32-check
          grep -Fq 'MECHOS_MECHSCOPE_SESSION_V22_SINGLE_OWNER' /tmp/hf32-check/usr/local/bin/mechscope-session
          grep -Fq 'MECHOS_MECHSCOPE_SINGLE_OWNER_V32' /tmp/hf32-check/usr/local/libexec/mechos-mechscope-safe-launch-v31
          grep -Fq 'MECHOS_SESSION_SINGLE_OWNER_V32' /tmp/hf32-check/usr/local/libexec/mechos-session-autostart-v31
          grep -Fq 'MECHOS_HOTFIX32_SINGLE_MECHSCOPE_OWNER_V1' /tmp/hf32-check/usr/local/libexec/mechos-hotfix-0.3.0-32-apply
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path('updates/bundles/MechOS-0.3.0-hotfix.32-update.tar.zst')
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['channel']=='stable'
          assert d['version']=='0.3.0-hotfix.32'
          assert d['requires_reboot'] is True
          assert hashlib.sha256(b.read_bytes()).hexdigest()==d['bundle_sha256']
          PY
