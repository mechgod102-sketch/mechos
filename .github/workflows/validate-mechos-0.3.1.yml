name: Validate MechOS 0.3.1

on:
  pull_request:
    paths:
      - 'scripts/mechos-0.3.1-phase1-apply.sh'
      - 'scripts/mechos-031-control-suite.py'
      - 'scripts/mechos-bridge-v031.py'
      - 'scripts/mechos-game-run-v031.py'
      - 'scripts/build-mechos-0.3.1.sh'
      - 'scripts/mechos-update-helper-v37.sh'
      - 'scripts/mechos-update-transaction-v14.sh'
      - 'scripts/validate-mechos-0.3.1.sh'
      - 'data/mechos-0.3.1-*.json'
      - 'docs/RELEASE-NOTES-0.3.1.md'
      - '.github/workflows/publish-mechos-0.3.1.yml'
      - '.github/workflows/validate-mechos-0.3.1.yml'
      - 'updates/mechos-update-signing-public.pem'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-0-3-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd imagemagick
      - name: Validate source contracts
        run: bash scripts/validate-mechos-0.3.1.sh
      - name: Validate wallpaper dimensions
        run: |
          set -euo pipefail
          for i in $(seq -w 1 16); do
            dims="$(identify -format '%wx%h' "overlay/rootfs/usr/share/backgrounds/mechos/mechos-wallpaper-$i.jpg")"
            test "$dims" = "1920x1080" || { echo "Wallpaper $i is $dims" >&2; exit 1; }
          done
      - name: Build cumulative update bundle
        run: bash scripts/build-mechos-0.3.1.sh
      - name: Validate built bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.1-update.tar.zst
          test -s "$B"; test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.1-update.tar.zst.sha256)
          tar --zstd -tf "$B" | grep -F './usr/local/libexec/mechos-update-transaction-v14'
          tar --zstd -tf "$B" | grep -F './usr/local/bin/mechos-update-helper'
          python3 - <<'PY'
          import json,tarfile
          from pathlib import Path
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['version']=='0.3.1'
          PY
