name: Validate MechOS v0.3.0 Hotfix 4 (Archived)

# Hotfix 4 is immutable historical validation. Newer source changes must not
# re-run an old validator against newer runtime markers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate archived Hotfix 4
        run: |
          set -euo pipefail
          bash scripts/build-hotfix-0.3.0-4.sh
          bash scripts/validate-hotfix-0.3.0-4.sh
