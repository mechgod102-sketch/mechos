name: Validate Retired MechOS v0.3.0 Hotfix 19

on:
  workflow_dispatch:

# Hotfix 19 is retired from stable publication. Current cumulative releases
# still reuse selected v19 launcher/helper sources, so edits to those files must
# never wake an old publisher and race updates/stable.json back to Hotfix 19.
permissions:
  contents: read

jobs:
  validate-retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Validate retired Hotfix 19 source only
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-19.sh
          bash scripts/build-hotfix-0.3.0-19.sh
          BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.19-update.tar.zst
          (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
          echo 'Hotfix 19 source remains buildable, but stable publication is retired.'
