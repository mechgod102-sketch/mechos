name: Publish MechOS v0.3.0 Hotfix 21

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-hotfix21-unified-store-patch.py'
      - 'scripts/mechos-hotfix-0.3.0-21-apply.sh'
      - 'scripts/build-hotfix-0.3.0-21.sh'
      - 'scripts/validate-hotfix-0.3.0-21.sh'
      - '.github/workflows/publish-hotfix-0.3.0-21.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-21-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate Hotfix 21
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-21.sh
          bash scripts/build-hotfix-0.3.0-21.sh
          BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.21-update.tar.zst
          (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
          CONTENTS="$(tar --zstd -tf "$BUNDLE")"
          grep -Fxq './usr/local/libexec/mechos-hotfix21-unified-store-patch' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-21-apply' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-game-catalog-v15' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-provider-bootstrap-v15' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-update-transaction-v14' <<< "$CONTENTS"
          grep -Fxq './usr/local/bin/mechos-update-center' <<< "$CONTENTS"
          echo 'Hotfix 21 cumulative bundle validation passed.'
      - name: Publish Hotfix 21 to Update Center stable channel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('updates/stable.json').read_text())
          assert data['version']=='0.3.0-hotfix.21', data
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.21-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.21-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 21 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 21'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 21 after three synchronized attempts.' >&2
          exit 1
