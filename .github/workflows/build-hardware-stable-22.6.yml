name: Build MechOS Hardware Stable - 22.6 Base + Latest Stable

on:
  workflow_dispatch:
    inputs:
      stable_target:
        description: 'Optional hotfix target, for example 0.3.0-hotfix.27. Requires its build script to exist.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'build-iso.sh'
      - 'scripts/**'
      - 'updates/stable.json'
      - 'updates/bundles/MechOS-0.3.0-hotfix.*-update.tar.zst'
      - 'updates/bundles/MechOS-0.3.0-hotfix.*-update.tar.zst.sha256'
      - '.github/workflows/build-hardware-stable-22.6.yml'

permissions:
  contents: read

concurrency:
  group: mechos-hardware-stable-22-6-latest
  cancel-in-progress: false

jobs:
  build-hardware-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          df -h

      - name: Validate hardware baseline and stable-target support
        run: |
          set -euo pipefail
          ./scripts/validate-project.sh
          bash scripts/validate-hotfix-0.3.0-22.sh
          bash -n build-iso.sh
          grep -Fq 'MECHOS_HARDWARE_TARGET_VERSION=${MECHOS_HARDWARE_TARGET_VERSION:-}' build-iso.sh
          bash -n scripts/mechos-hardware-verify-v22.sh
          bash -n scripts/mechos-hardware-stable-seed-v22.sh
          bash -n scripts/mechos-hardware-prepare-stable.sh
          bash -n scripts/mechos-hardware-follow-stable.sh
          bash -n scripts/mechos-postinstall-account-hotfix.sh
          grep -Fq 'MECHOS_HARDWARE_STABLE_SEED_V22_7' scripts/mechos-hardware-stable-seed-v22.sh
          grep -Fq 'MECHOS_HARDWARE_PREPARE_STABLE_V1' scripts/mechos-hardware-prepare-stable.sh
          grep -Fq 'MECHOS_HARDWARE_FOLLOW_STABLE_V1' scripts/mechos-hardware-follow-stable.sh
          grep -Fq 'MECHOS_HARDWARE_STABLE_RELEASE_COMMIT_V1' scripts/mechos-hardware-follow-stable.sh
          grep -Fq 'MECHOS_POSTINSTALL_ACCOUNT_HOTFIX_V2' scripts/mechos-postinstall-account-hotfix.sh
          grep -Fq 'mechos-oobe-finish-reboot' scripts/mechos-postinstall-account-hotfix.sh
          grep -Fq '99-mechos-final-user.conf' scripts/mechos-postinstall-account-hotfix.sh
          grep -Fq 'EXPECTED_VERSION=0.3.0-hotfix.22.6' scripts/mechos-hardware-stable-seed-v22.sh
          grep -Fq 'EXPECTED_SHA=54a2192bdcf93556ca5a9d24b7f450b2c58ca60f71acce55eef0bac9540cb5fe' scripts/mechos-hardware-stable-seed-v22.sh
          bash -n scripts/mechos-live-installer-final-hardening.sh
          grep -Fq 'MECHOS_LIVE_INSTALLER_FINAL_HARDENING_V1' scripts/mechos-live-installer-final-hardening.sh
          grep -Fq 'mechos-live-installer-final-hardening.sh' scripts/mechos-hotfix13-stability-integration.sh
          python3 -m py_compile scripts/patch-mechos-hardware-stable-22.6.py
          (
            cd updates/bundles
            sha256sum -c MechOS-0.3.0-hotfix.22.6-update.tar.zst.sha256
          )
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urlparse

          manifest = json.loads(Path('updates/stable.json').read_text(encoding='utf-8'))
          assert manifest['channel'] == 'stable', manifest
          version = manifest['version']
          assert re.fullmatch(r'0\.3\.0-hotfix\.\d+(?:\.\d+)*', version), version
          name = Path(urlparse(manifest['bundle_url']).path).name
          bundle = Path('updates/bundles') / name
          if bundle.is_file():
              actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
              assert actual == manifest['bundle_sha256'], (actual, manifest['bundle_sha256'])
              print(f'hardware stable target: {version} bundle={name} sha256={actual}')
          else:
              builder = Path('scripts') / f'build-hotfix-{version}.sh'
              assert builder.is_file(), f'{bundle} missing and {builder} does not exist'
              print(f'hardware stable target: {version}; bundle will be generated from {builder}')

          def key(v):
              m = re.fullmatch(r'0\.3\.0-hotfix\.(\d+(?:\.\d+)*)', v)
              assert m, v
              return tuple(int(x) for x in m.group(1).split('.'))
          assert key('0.3.0-hotfix.27') > key('0.3.0-hotfix.26')
          assert key('0.3.0-hotfix.27.1') > key('0.3.0-hotfix.27')
          PY
          grep -Fq 'MECHOS_CREATOR_EXTERNAL_QT_HANDOFF_V26' scripts/mechos-mode-launch-v19.sh
          grep -Fq 'MECHOS_CREATOR_EXTERNAL_QT_HANDOFF_V26' scripts/mechos-shell-route-v19.sh
          grep -Fq 'MECHOS_MECHSCOPE_RUNTIME_V26' scripts/mechos-mechscope-runtime-v23.py
          grep -Fq 'MECHOS_HOTFIX22_APPLY_V8' scripts/mechos-hotfix-0.3.0-22-apply.sh

      - name: Apply current MechOS integration stack
        run: |
          set -euo pipefail
          python3 scripts/patch-mechos-current.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-partition-screen.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-safe-mode-switching.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-default-wallpaper.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-substance-painter.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-creator-postinstall.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-rgb-quick-actions.py scripts/build-mechos-archiso.sh
          bash scripts/patch-mechos-live-autologin-partitionmanager.sh scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-reference-v5.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-hardware-stable-22.6.py scripts/build-mechos-archiso.sh
          bash -n scripts/build-mechos-archiso.sh
          test "$(grep -c '^# MECHOS_HARDWARE_STABLE_22_6_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          grep -Fq 'bash /workspace/scripts/mechos-hardware-prepare-stable.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'bash /workspace/scripts/mechos-hardware-stable-seed-v22.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'bash /workspace/scripts/mechos-postinstall-account-hotfix.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'bash /workspace/scripts/mechos-hardware-follow-stable.sh final' scripts/build-mechos-archiso.sh
          python3 - <<'PY'
          from pathlib import Path
          t=Path('scripts/build-mechos-archiso.sh').read_text()
          prepare='bash /workspace/scripts/mechos-hardware-prepare-stable.sh final'
          seed='bash /workspace/scripts/mechos-hardware-stable-seed-v22.sh final'
          account='bash /workspace/scripts/mechos-postinstall-account-hotfix.sh final'
          latest='bash /workspace/scripts/mechos-hardware-follow-stable.sh final'
          assert t.index(prepare) < t.index(seed) < t.index(account) < t.index(latest) < t.rindex('mkarchiso')
          PY
          grep -Fq 'mechos-finalize-install-payload.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-hotfix13-stability-integration.sh' scripts/build-mechos-archiso.sh

      - name: Build physical hardware ISO
        env:
          MECHOS_HARDWARE_TARGET_VERSION: ${{ github.event.inputs.stable_target }}
        run: ./build-iso.sh

      - name: Verify and name hardware candidate
        run: |
          set -euo pipefail
          STABLE_VERSION="$(python3 -c "import json; print(json.load(open('updates/stable.json'))['version'])")"
          REQUESTED="${{ github.event.inputs.stable_target }}"
          if [ -n "$REQUESTED" ]; then
            STABLE_VERSION="$REQUESTED"
          fi
          ISO="$(find out -maxdepth 2 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          test -s "$ISO"
          test -s "$ISO.sha256"
          (
            cd "$(dirname "$ISO")"
            sha256sum -c "$(basename "$ISO").sha256"
          )
          DIR="$(dirname "$ISO")"
          TARGET="$DIR/MechOS-v${STABLE_VERSION}-hardware-22.6-base-x86_64.iso"
          if [ "$ISO" != "$TARGET" ]; then
            mv -f "$ISO" "$TARGET"
            rm -f "$ISO.sha256"
          fi
          (
            cd "$DIR"
            sha256sum "$(basename "$TARGET")" >"$(basename "$TARGET").sha256"
            sha256sum -c "$(basename "$TARGET").sha256"
          )
          cat >out/HARDWARE-TEST-README.txt <<EOF
          MechOS Hardware Validation ISO
          Hardware baseline: 0.3.0-hotfix.22.6
          Stable target baked into this build: $STABLE_VERSION

          Goal:
          - verify clean UEFI boot and installation on real hardware
          - verify the installed payload contains at least the validated Hotfix 22.6 hardware baseline
          - verify the newest published or explicitly requested cumulative hotfix is layered after the 22.6 baseline
          - verify first boot activates the target hotfix and only then commits /etc/mechos/release
          - verify first installed boot goes directly into fullscreen account creation
          - verify mechos-setup is only a temporary transport account and never the final owner
          - verify finishing OOBE creates the requested user, assigns its password/admin groups, and schedules a privileged reboot
          - verify the next boot removes mechos-setup before SDDM starts and shows the real user sign-in
          - verify GPU/Vulkan, Wi-Fi/Ethernet, Bluetooth, PipeWire audio, storage and controllers
          - verify MechScope startup and MechScope -> Creator Mode external Qt handoff
          - verify reboot/shutdown and suspend/resume manually

          Stable selection:
          - updates/stable.json remains the normal source of truth.
          - workflow_dispatch can explicitly request a target such as 0.3.0-hotfix.27 once its build script exists.
          - pushes touching build-iso.sh, scripts, the stable manifest, or hotfix bundles retrigger this hardware workflow.
          - if the manifest points to a target whose bundle has not yet been generated, the hardware build can generate it from the exact matching build-hotfix script.
          - the build refuses a target older than 0.3.0-hotfix.22.6.
          - the stable bundle SHA256 must match the resolved manifest before it is packed into the installed payload.

          After signing in run:
              cat /etc/mechos/release
              cat /etc/mechos/hardware-test-build
              id
              getent passwd mechos-setup || echo "mechos-setup removed"
              cat /var/lib/mechos/system-user
              mechos-hardware-verify

          Expected release after first-boot activation:
              $STABLE_VERSION

          Save the complete mechos-hardware-verify output when reporting a hardware issue.
          EOF
          ls -lh "$TARGET" "$TARGET.sha256" out/HARDWARE-TEST-README.txt

      - name: Upload hardware test ISO
        uses: actions/upload-artifact@v4
        with:
          name: MechOS-hardware-22.6-base-latest-stable-x86_64
          path: |
            out/**/*.iso
            out/**/*.iso.sha256
            out/HARDWARE-TEST-README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
