name: Publish MechOS v0.3.0 Hotfix 11

# Historical publisher retained for manual recovery only. Hotfix 12 owns the
# current stable channel and shared runtime changes must not republish v11.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate Hotfix 11
        run: |
          set -euo pipefail
          bash -n scripts/mechos-vm-mode-runtime-hotfix5.sh
          bash -n scripts/mechos-mode-launch-hotfix10.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/mechos-mechscope-runtime-imports-v11.py
          bash scripts/build-hotfix-0.3.0-11.sh
          bash scripts/validate-hotfix-0.3.0-11.sh
      - name: Publish Hotfix 11 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.11-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.11-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 11 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 11'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 11 after three synchronized attempts.' >&2
          exit 1
