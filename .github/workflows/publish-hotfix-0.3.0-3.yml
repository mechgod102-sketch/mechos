name: Publish MechOS v0.3.0 Hotfix 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-hotfix-0.3.0-3-apply.sh'
      - 'scripts/build-hotfix-0.3.0-3.sh'
      - 'scripts/validate-hotfix-0.3.0-3.sh'
      - 'scripts/mechos-preoobe-update-auth-runtime.sh'
      - '.github/workflows/publish-hotfix-0.3.0-3.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build and validate Hotfix 3
        run: |
          set -euo pipefail
          chmod +x scripts/mechos-hotfix-0.3.0-3-apply.sh
          chmod +x scripts/build-hotfix-0.3.0-3.sh
          chmod +x scripts/validate-hotfix-0.3.0-3.sh
          bash scripts/build-hotfix-0.3.0-3.sh
          bash scripts/validate-hotfix-0.3.0-3.sh

      - name: Publish Hotfix 3 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.3-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.3-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 3 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 3'

          # Another publisher or validation bot may have advanced main after
          # checkout. Rebase the generated release commit before pushing so a
          # harmless concurrent commit cannot strand the stable hotfix.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 3 after three synchronized attempts.' >&2
          exit 1
