name: Publish MechOS Hotfix 33

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hotfix-33.yml'

permissions:
  contents: write

concurrency:
  group: publish-mechos-hotfix-33
  cancel-in-progress: false

jobs:
  publish-hotfix-33:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Validate Hotfix 33 sources
        run: bash scripts/validate-hotfix-0.3.0-33.sh
      - name: Build cumulative Hotfix 33 bundle
        run: bash scripts/build-hotfix-0.3.0-33.sh
      - name: Verify Hotfix 33 publication files
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.0-hotfix.33-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.0-hotfix.33-update.tar.zst.sha256)
          tar --zstd -tf "$B" | grep -F './usr/local/libexec/mechos-mechscope-source-runtime-v33'
          tar --zstd -tf "$B" | grep -F './usr/local/share/mechos/mechscope/mechscope_shell.py'
          tar --zstd -tf "$B" | grep -F './usr/local/bin/mechscope-session'
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('updates/stable.json'); data=json.loads(p.read_text())
          assert data['channel']=='stable'
          assert data['version']=='0.3.0-hotfix.33'
          assert data['requires_reboot'] is True
          b=Path('updates/bundles/MechOS-0.3.0-hotfix.33-update.tar.zst')
          assert hashlib.sha256(b.read_bytes()).hexdigest()==data['bundle_sha256']
          PY
      - name: Commit stable Hotfix 33
        run: |
          set -euo pipefail
          git config user.name 'MechOS Hotfix Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add updates/stable.json \
            updates/bundles/MechOS-0.3.0-hotfix.33-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.33-update.tar.zst.sha256
          if git diff --cached --quiet; then
            echo 'Hotfix 33 publication files are already committed.'
            exit 0
          fi
          git commit -m 'release: publish MechOS Hotfix 33'
          git push origin HEAD:main
