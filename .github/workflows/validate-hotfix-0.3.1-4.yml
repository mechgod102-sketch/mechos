name: Validate MechOS 0.3.1 Hotfix 4

on:
  pull_request:
    paths:
      - 'scripts/mechos-update-helper-core-v39.sh'
      - 'scripts/mechos-update-center-reference-v8.py'
      - 'scripts/build-hotfix-0.3.1-4.sh'
      - 'scripts/validate-hotfix-0.3.1-4.sh'
      - 'docs/RELEASE-NOTES-0.3.1-hotfix.4.md'
      - '.github/workflows/validate-hotfix-0.3.1-4.yml'
      - '.github/workflows/publish-hotfix-0.3.1-4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hotfix-0-3-1-4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd openssl
      - name: Validate package refresh behavior
        run: bash scripts/validate-hotfix-0.3.1-4.sh
      - name: Build cumulative Hotfix 4 bundle
        run: bash scripts/build-hotfix-0.3.1-4.sh
      - name: Verify built bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.1-hotfix.4-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.1-hotfix.4-update.tar.zst.sha256)
          CONTENTS="$(tar --zstd -tf "$B")"
          for member in             './usr/local/share/mechos/update-engine/slots/0.3.1-hotfix.4/mechos-update-helper-core'             './usr/local/share/mechos/update-engine/slots/0.3.1-hotfix.4/mechos-update-center-backend.py'             './usr/local/share/mechos/update-engine/slots/0.3.1-hotfix.4/mechos-update-transaction'; do
            grep -Fxq "$member" <<<"$CONTENTS"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['version']=='0.3.1-hotfix.4'
          assert d['release_name']=='MechOS v0.3.1 Hotfix 4'
          assert d['requires_reboot'] is True
          PY
