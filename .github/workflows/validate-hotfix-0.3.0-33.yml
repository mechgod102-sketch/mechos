name: Validate MechOS Hotfix 33

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mechos-mechscope-source-runtime-v33.py'
      - 'src/mechscope/mechscope_shell.py'
      - 'scripts/mechscope-session-v20.sh'
      - 'overlay/rootfs/usr/local/bin/mechscope-session'
      - 'scripts/mechos-mechscope-safe-launch-v31.sh'
      - 'scripts/mechos-mechscope-user-cleanup-v33.sh'
      - 'scripts/mechos-hotfix-0.3.0-33-apply.sh'
      - 'scripts/build-hotfix-0.3.0-33.sh'
      - 'scripts/validate-hotfix-0.3.0-33.sh'
      - '.github/workflows/validate-hotfix-0.3.0-33.yml'
      - '.github/workflows/publish-hotfix-33.yml'
  push:
    branches:
      - 'hotfix/0.3.0-33-source-owned-mechscope-runtime'

permissions:
  contents: read

concurrency:
  group: validate-mechos-hotfix-33-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hotfix-33:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Validate Hotfix 33 source contracts
        run: bash scripts/validate-hotfix-0.3.0-33.sh
      - name: Build cumulative Hotfix 33 bundle
        run: bash scripts/build-hotfix-0.3.0-33.sh
      - name: Validate Hotfix 33 bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.0-hotfix.33-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.0-hotfix.33-update.tar.zst.sha256)
          rm -rf /tmp/hf33-check && mkdir -p /tmp/hf33-check
          tar --zstd -xpf "$B" -C /tmp/hf33-check
          test -f /tmp/hf33-check/usr/local/libexec/mechos-mechscope-source-runtime-v33
          test -f /tmp/hf33-check/usr/local/share/mechos/mechscope/mechscope_shell.py
          test -f /tmp/hf33-check/usr/local/bin/mechscope-session
          test -f /tmp/hf33-check/usr/local/libexec/mechos-mechscope-safe-launch-v31
          test -f /tmp/hf33-check/usr/local/libexec/mechos-hotfix-0.3.0-33-apply
          test -f /tmp/hf33-check/etc/xdg/autostart/mechos-mechscope-user-cleanup-v33.desktop
          grep -Fq 'MECHOS_MECHSCOPE_SOURCE_RUNTIME_V33' /tmp/hf33-check/usr/local/libexec/mechos-mechscope-source-runtime-v33
          grep -Fq 'MECHOS_MECHSCOPE_SESSION_V23_SOURCE_RUNTIME' /tmp/hf33-check/usr/local/bin/mechscope-session
          grep -Fq 'MECHOS_MECHSCOPE_SOURCE_RUNTIME_ROUTE_V33' /tmp/hf33-check/usr/local/libexec/mechos-mechscope-safe-launch-v31
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path('updates/bundles/MechOS-0.3.0-hotfix.33-update.tar.zst')
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['channel']=='stable'
          assert d['version']=='0.3.0-hotfix.33'
          assert d['requires_reboot'] is True
          assert hashlib.sha256(b.read_bytes()).hexdigest()==d['bundle_sha256']
          PY
