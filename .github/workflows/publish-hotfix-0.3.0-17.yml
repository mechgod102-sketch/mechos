name: Publish MechOS v0.3.0 Hotfix 17

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-17-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Refuse Stable downgrade
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('updates/stable.json')
          if p.exists():
              v=json.loads(p.read_text()).get('version','0.0.0')
              if v == '0.3.1' or v.startswith('0.3.1-hotfix.'):
                  raise SystemExit(f'Refusing to downgrade Stable from {v} to 0.3.0-hotfix.17')
          PY
      - name: Build and validate Hotfix 17
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-17.sh
          bash scripts/build-hotfix-0.3.0-17.sh
          BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.17-update.tar.zst
          (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
          CONTENTS="$(tar --zstd -tf "$BUNDLE")"
          grep -Fxq './usr/local/libexec/mechos-update-transaction-v13' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-update-transaction-v14' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix17-updater-patch' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-clear-reboot-required-v17' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-17-apply' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-16-apply' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-15-apply' <<< "$CONTENTS"
          echo 'Hotfix 17 cumulative updater-repair bundle validation passed.'
      - name: Publish Hotfix 17 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.15-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.15-update.tar.zst.sha256 \
            updates/bundles/MechOS-0.3.0-hotfix.16-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.16-update.tar.zst.sha256 \
            updates/bundles/MechOS-0.3.0-hotfix.17-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.17-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 17 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 17'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 17 after three synchronized attempts.' >&2
          exit 1
