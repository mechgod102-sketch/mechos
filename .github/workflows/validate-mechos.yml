name: Validate MechOS Source

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4

      - name: Run static validation
        run: |
          ./scripts/validate-project.sh
          bash scripts/validate-gamescope-universal.sh
          bash scripts/validate-native-installer.sh
          bash scripts/validate-reference-ui.sh
          bash scripts/validate-reference-stores-v3.sh
          bash scripts/validate-reference-surfaces-v4.sh
          bash scripts/validate-radarai-performance-integration.sh
          bash scripts/validate-creator-mode-launch.sh
          bash scripts/validate-reference-v5.sh
          bash scripts/validate-mechscope-exact-reference.sh
          bash scripts/validate-native-ui-shell.sh
          bash scripts/validate-live-installer-runtime-guard.sh
          bash scripts/validate-live-update-pacman-sandbox.sh
          bash scripts/validate-aur-helper.sh
          bash scripts/validate-vm-ui-runtime-guard.sh
          bash scripts/validate-vm-shortcut-launch.sh
