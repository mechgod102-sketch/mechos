name: Publish MechOS v0.3.0 Hotfix 7

# Historical publisher retained for manual recovery only. Newer hotfixes own
# the stable channel and shared runtime files must not retrigger Hotfix 7.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build and validate Hotfix 7
        run: |
          set -euo pipefail
          bash scripts/build-hotfix-0.3.0-7.sh
          bash scripts/validate-hotfix-0.3.0-7.sh

      - name: Publish Hotfix 7 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.7-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.7-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 7 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 7'
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 7 after three synchronized attempts.' >&2
          exit 1
