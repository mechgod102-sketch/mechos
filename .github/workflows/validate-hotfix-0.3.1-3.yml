name: Validate MechOS 0.3.1 Hotfix 3

on:
  pull_request:
    paths:
      - 'scripts/mechos-update-helper-launcher-v38.sh'
      - 'scripts/mechos-update-center-launcher-v38.sh'
      - 'scripts/mechos-update-helper-core-v38.sh'
      - 'scripts/mechos-update-engine-switch-v38.sh'
      - 'scripts/mechos-update-self-repair-v0313.sh'
      - 'scripts/mechos-update-transaction-v15.sh'
      - 'scripts/mechos-hotfix-0.3.1-3-apply.sh'
      - 'scripts/build-hotfix-0.3.1-3.sh'
      - 'scripts/validate-hotfix-0.3.1-3.sh'
      - 'scripts/mechos-update-center-reference-v8.py'
      - 'docs/RELEASE-NOTES-0.3.1-hotfix.3.md'
      - '.github/workflows/validate-hotfix-0.3.1-3.yml'
      - '.github/workflows/publish-hotfix-0.3.1-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hotfix-0-3-1-3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd openssl
      - name: Validate A/B updater isolation
        run: bash scripts/validate-hotfix-0.3.1-3.sh
      - name: Build cumulative Hotfix 3 bundle
        run: bash scripts/build-hotfix-0.3.1-3.sh
      - name: Verify built bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.1-hotfix.3-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.1-hotfix.3-update.tar.zst.sha256)
          CONTENTS="$(tar --zstd -tf "$B")"
          for member in             './usr/local/bin/mechos-update-helper'             './usr/local/bin/mechos-update-center'             './usr/local/share/mechos/update-engine/slots/0.3.1-hotfix.3/mechos-update-helper-core'             './usr/local/share/mechos/update-engine/slots/0.3.1-hotfix.3/mechos-update-center-backend.py'             './usr/local/share/mechos/update-engine/slots/0.3.1-hotfix.3/mechos-update-transaction'             './usr/local/libexec/mechos-update-engine-switch-v38'             './usr/local/libexec/mechos-update-self-repair-v0313'             './usr/local/libexec/mechos-update-transaction-v14'; do
            grep -Fxq "$member" <<<"$CONTENTS"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['version']=='0.3.1-hotfix.3'
          assert d['release_name']=='MechOS v0.3.1 Hotfix 3'
          assert d['requires_reboot'] is True
          PY
