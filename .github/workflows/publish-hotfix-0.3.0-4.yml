name: Publish MechOS v0.3.0 Hotfix 4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-hotfix-0.3.0-4-apply.sh'
      - 'scripts/build-hotfix-0.3.0-4.sh'
      - 'scripts/validate-hotfix-0.3.0-4.sh'
      - 'src/mechos_ui/fixed_canvas.py'
      - 'src/mechos_ui/creator_shell.py'
      - '.github/workflows/publish-hotfix-0.3.0-4.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build and validate Hotfix 4 before publication
        run: |
          set -euo pipefail
          chmod +x scripts/mechos-hotfix-0.3.0-4-apply.sh
          chmod +x scripts/build-hotfix-0.3.0-4.sh
          chmod +x scripts/validate-hotfix-0.3.0-4.sh
          bash scripts/build-hotfix-0.3.0-4.sh
          bash scripts/validate-hotfix-0.3.0-4.sh

      - name: Publish Hotfix 4 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.4-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.4-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 4 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 4'

          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 4 after three synchronized attempts.' >&2
          exit 1
