name: Validate MechOS v0.3.0 Hotfix 5 (Archived)

# Hotfix 5 is immutable historical validation. Newer VM runtime changes are
# validated by the current source/hotfix workflows instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate archived Hotfix 5
        run: |
          set -euo pipefail
          bash scripts/build-hotfix-0.3.0-5.sh
          bash scripts/validate-hotfix-0.3.0-5.sh
