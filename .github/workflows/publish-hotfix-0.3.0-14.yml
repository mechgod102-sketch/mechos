name: Publish MechOS v0.3.0 Hotfix 14

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-14-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate Hotfix 14
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-14.sh
          bash scripts/build-hotfix-0.3.0-14.sh
          BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.14-update.tar.zst
          (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
          CONTENTS="$(tar --zstd -tf "$BUNDLE")"
          grep -Fxq './usr/local/bin/mechos-update-helper' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-update-guard-v14' <<< "$CONTENTS"
          echo 'Hotfix 14 bundle validation passed.'
      - name: Publish Hotfix 14 to Update Center stable channel
        run: |
          set -euo pipefail
          git fetch origin main
          REMOTE_VERSION="$(git show origin/main:updates/stable.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')"
          if [ "$REMOTE_VERSION" != '0.3.0-hotfix.14' ] && [ -n "$REMOTE_VERSION" ]; then
            echo "Stable channel is already $REMOTE_VERSION; refusing to downgrade it to Hotfix 14."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.14-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.14-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 14 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 14'
          git push origin HEAD:main
