name: Validate MechOS v0.3.0 Hotfix 20

on:
  pull_request:
    paths:
      - 'scripts/mechos-update-transaction-v20.sh'
      - 'scripts/mechos-hotfix-0.3.0-20-apply.sh'
      - 'scripts/build-hotfix-0.3.0-20.sh'
      - 'scripts/validate-hotfix-0.3.0-20.sh'
      - '.github/workflows/validate-hotfix-0.3.0-20.yml'
      - '.github/workflows/publish-hotfix-0.3.0-20.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Validate Hotfix 20 source
        run: bash scripts/validate-hotfix-0.3.0-20.sh
