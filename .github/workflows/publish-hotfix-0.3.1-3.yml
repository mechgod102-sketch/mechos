name: Publish MechOS 0.3.1 Hotfix 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-update-helper-launcher-v38.sh'
      - 'scripts/mechos-update-center-launcher-v38.sh'
      - 'scripts/mechos-update-helper-core-v38.sh'
      - 'scripts/mechos-update-engine-switch-v38.sh'
      - 'scripts/mechos-update-self-repair-v0313.sh'
      - 'scripts/mechos-update-transaction-v15.sh'
      - 'scripts/mechos-hotfix-0.3.1-3-apply.sh'
      - 'scripts/build-hotfix-0.3.1-3.sh'
      - 'scripts/validate-hotfix-0.3.1-3.sh'
      - 'scripts/mechos-update-center-reference-v8.py'
      - 'docs/RELEASE-NOTES-0.3.1-hotfix.3.md'
      - '.github/workflows/publish-hotfix-0.3.1-3.yml'

permissions:
  contents: write

concurrency:
  group: mechos-stable-publish
  cancel-in-progress: false

jobs:
  publish-hotfix-0-3-1-3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd openssl
      - name: Validate Hotfix 3
        run: bash scripts/validate-hotfix-0.3.1-3.sh
      - name: Build cumulative Hotfix 3
        run: bash scripts/build-hotfix-0.3.1-3.sh
      - name: Sign Stable manifest
        env:
          SIGNING_KEY: ${{ secrets.MECHOS_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo 'MECHOS_UPDATE_SIGNING_PRIVATE_KEY is not configured.' >&2; exit 43; }
          key="$RUNNER_TEMP/mechos-update-signing-private.pem"
          derived="$RUNNER_TEMP/mechos-update-signing-public.pem"
          expected="$RUNNER_TEMP/mechos-update-signing-public-expected.pem"
          printf '%s\n' "$SIGNING_KEY" >"$key"
          chmod 0600 "$key"
          openssl pkey -in "$key" -pubout -out "$derived"
          openssl pkey -pubin -in updates/mechos-update-signing-public.pem -pubout -out "$expected"
          cmp -s "$derived" "$expected" || { echo 'Signing key mismatch.' >&2; exit 44; }
          openssl dgst -sha256 -sign "$key" -out updates/stable.json.sig updates/stable.json
          openssl dgst -sha256 -verify updates/mechos-update-signing-public.pem             -signature updates/stable.json.sig updates/stable.json
      - name: Verify publication files
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.1-hotfix.3-update.tar.zst
          (cd updates/bundles && sha256sum -c MechOS-0.3.1-hotfix.3-update.tar.zst.sha256)
          test -s updates/stable.json.sig
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['version']=='0.3.1-hotfix.3'
          b=Path('updates/bundles/MechOS-0.3.1-hotfix.3-update.tar.zst')
          assert hashlib.sha256(b.read_bytes()).hexdigest()==d['bundle_sha256']
          PY
      - name: Commit Stable Hotfix 3
        run: |
          set -euo pipefail
          git config user.name 'MechOS Release Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add             updates/stable.json             updates/stable.json.sig             updates/bundles/MechOS-0.3.1-hotfix.3-update.tar.zst             updates/bundles/MechOS-0.3.1-hotfix.3-update.tar.zst.sha256
          if git diff --cached --quiet; then
            echo '0.3.1-hotfix.3 publication files are already committed.'
            exit 0
          fi
          git commit -m 'release: publish MechOS 0.3.1 Hotfix 3'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort >/dev/null 2>&1 || true; exit 1; }
          done
          exit 1
