name: Publish MechOS v0.3.0 Hotfix 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-hotfix-0.3.0-2-apply.sh'
      - 'scripts/build-hotfix-0.3.0-2.sh'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stable-channel downgrade
        id: guard
        run: |
          set -euo pipefail
          current="$(python3 - <<'PY'
import json
from pathlib import Path
p=Path('updates/stable.json')
if p.exists():
    try: print(json.loads(p.read_text()).get('version',''))
    except Exception: print('')
else: print('')
PY
)"
          if [ -n "$current" ]; then
            top="$(printf '%s\n%s\n' '0.3.0-hotfix.2' "$current" | sort -V | tail -n1)"
            if [ "$top" = "$current" ] && [ "$current" != '0.3.0-hotfix.2' ]; then
              echo "Stable already points to newer release $current; Hotfix 2 publisher will not run."
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'skip=false' >> "$GITHUB_OUTPUT"

      - name: Install bundle tooling
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build Hotfix 2 bundle
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/mechos-hotfix-0.3.0-2-apply.sh
          chmod +x scripts/build-hotfix-0.3.0-2.sh
          chmod +x scripts/validate-hotfix-0.3.0-2.sh
          bash scripts/build-hotfix-0.3.0-2.sh
          bash scripts/validate-hotfix-0.3.0-2.sh

      - name: Publish verified archived bundle
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.2-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.2-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 2 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 2'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
