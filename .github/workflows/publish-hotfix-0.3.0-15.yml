name: Publish MechOS v0.3.0 Hotfix 15

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-mode-launch-v15.sh'
      - 'scripts/mechos-mode-launch-hotfix10.sh'
      - 'scripts/mechos-provider-bootstrap-v15.sh'
      - 'scripts/mechos-game-catalog-v15.py'
      - 'scripts/mechos-hotfix15-runtime-patch.py'
      - 'scripts/mechos-hotfix15-game-browser-patch.py'
      - 'scripts/mechos-hotfix-0.3.0-15-apply.sh'
      - 'scripts/build-hotfix-0.3.0-15.sh'
      - 'scripts/validate-hotfix-0.3.0-15.sh'
      - '.github/workflows/publish-hotfix-0.3.0-15.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-15-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate Hotfix 15
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-15.sh
          bash scripts/build-hotfix-0.3.0-15.sh
          BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.15-update.tar.zst
          (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
          CONTENTS="$(tar --zstd -tf "$BUNDLE")"
          grep -Fxq './usr/local/bin/mechos-mode-launch' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-provider-bootstrap-v15' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-game-catalog-v15' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix15-game-browser-patch' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-15-apply' <<< "$CONTENTS"
          echo 'Hotfix 15 bundle validation passed.'
      - name: Publish Hotfix 15 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.15-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.15-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 15 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 15'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            git clean -fd
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 15 after three synchronized attempts.' >&2
          exit 1
