name: Build MechOS Arch ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/mechos-new-build-final-gate.sh'
      - 'scripts/mechos-new-build-final-hardening.sh'
      - 'scripts/mechos-build113-live-boot-splash-fix.sh'
      - 'scripts/mechos-build118-six-regression-final.sh'
      - 'scripts/mechos-build119-vm-mechscope-final.sh'
      - 'scripts/mechos-vm-mode-runtime-hotfix5.sh'
      - 'scripts/mechos-mode-launch-hotfix5.sh'
      - 'scripts/patch-mechos-reference-v5.py'
      - 'scripts/validate-new-build-final-gate.sh'
      - 'overlay/rootfs/etc/mechos/release'
      - 'overlay/rootfs/etc/mechos/mechos.conf'
      - 'overlay/rootfs/etc/system-release'
      - '.github/workflows/build-mechos.yml'

permissions:
  contents: read

concurrency:
  group: mechos-iso-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -af --volumes || true
          df -h

      - name: Validate MechOS source
        run: |
          ./scripts/validate-project.sh
          bash scripts/validate-gamescope-universal.sh
          bash scripts/validate-native-installer.sh
          bash scripts/validate-reference-ui.sh
          bash scripts/validate-reference-stores-v3.sh
          bash scripts/validate-reference-surfaces-v4.sh
          bash scripts/validate-radarai-performance-integration.sh
          bash scripts/validate-creator-mode-launch.sh
          bash scripts/validate-reference-v5.sh
          bash scripts/validate-mechscope-exact-reference.sh
          bash scripts/validate-native-ui-shell.sh
          bash scripts/validate-auto-optimization.sh
          bash scripts/validate-source-owned-system-ui.sh
          bash scripts/validate-live-installer-owner.sh
          bash scripts/validate-installer-reference-runtime.sh
          bash scripts/validate-installer-auto-reboot.sh
          bash scripts/validate-update-center-v1.sh
          bash scripts/validate-update-center-v2.sh
          bash scripts/validate-reference-splash.sh
          bash scripts/validate-plymouth-native-final.sh
          bash scripts/validate-live-installer-runtime-guard.sh
          bash scripts/validate-live-update-pacman-sandbox.sh
          bash scripts/validate-aur-helper.sh
          bash scripts/validate-vm-ui-runtime-guard.sh
          bash scripts/validate-vm-shortcut-launch.sh
          bash scripts/validate-installed-mechscope-launch.sh
          bash scripts/validate-vm-mode-runtime-final.sh
          bash scripts/validate-firstboot-vm-runtime.sh
          bash scripts/validate-new-build-final-gate.sh
          bash -n scripts/mechos-build113-live-boot-splash-fix.sh
          grep -Fq 'PACKAGES="/workspace/archlive/packages.x86_64"' scripts/mechos-build113-live-boot-splash-fix.sh
          grep -Fq "grep -qx 'plasma-meta' \"\$PACKAGES\"" scripts/mechos-build113-live-boot-splash-fix.sh
          grep -Fq 'pacman -Si plasma-workspace' scripts/mechos-build113-live-boot-splash-fix.sh
          if grep -Fq 'if [ ! -f "$ROOT/usr/share/wayland-sessions/plasma.desktop"' scripts/mechos-build113-live-boot-splash-fix.sh; then
            echo 'Build 113 must not inspect package-owned Plasma session files before mkarchiso installs packages.' >&2
            exit 1
          fi
          bash -n scripts/mechos-build118-six-regression-final.sh
          bash -n scripts/mechos-build119-vm-mechscope-final.sh
          bash -n scripts/mechos-vm-mode-runtime-hotfix5.sh
          bash -n scripts/mechos-mode-launch-hotfix5.sh
          grep -Fq 'MECHOS_HOTFIX5_VM_DIRECT_ROUTER_V1' scripts/mechos-mode-launch-hotfix5.sh
          grep -Fq '/usr/local/bin/mechscope.real' scripts/mechos-vm-mode-runtime-hotfix5.sh
          grep -Fq 'oobe-complete' scripts/mechos-vm-mode-runtime-hotfix5.sh

      - name: Apply cumulative MechOS integration
        run: |
          set -euo pipefail
          python3 scripts/patch-mechos-current.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-partition-screen.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-safe-mode-switching.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-default-wallpaper.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-substance-painter.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-creator-postinstall.py scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-rgb-quick-actions.py scripts/build-mechos-archiso.sh
          bash scripts/patch-mechos-live-autologin-partitionmanager.sh scripts/build-mechos-archiso.sh
          python3 scripts/patch-mechos-reference-v5.py scripts/build-mechos-archiso.sh
          bash -n scripts/build-mechos-archiso.sh
          test "$(grep -c '^# MECHOS_CURRENT_INTEGRATION_EARLY$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_CURRENT_INTEGRATION_LATE$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_PARTITION_SCREEN_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_SAFE_MODE_SWITCHING_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_DEFAULT_WALLPAPER_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_SUBSTANCE_PAINTER_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_CREATOR_POSTINSTALL_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_RGB_QUICK_ACTIONS_INTEGRATION$' scripts/build-mechos-archiso.sh)" -eq 1
          test "$(grep -c '^# MECHOS_REFERENCE_UI_V5_FINAL$' scripts/build-mechos-archiso.sh)" -eq 1
          grep -Fq 'mechos-gamescope-amd-compat-integration.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-ui-integration.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-stores-v3-integration.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-radarai-performance-integration.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-surfaces-v4-integration.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-integration.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-store-layout.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-mechscope-layout.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-mechscope-exact-layout.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-creator-layout.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-controls-layout.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-controls-compat.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-aur-helper-integration.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-v5-installer-layout.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-live-update-pacman-sandbox-hotfix.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-live-installer-runtime-guard.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-vm-ui-runtime-guard.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-vm-shortcut-launch-hotfix.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-native-ui-shell-integration.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-auto-optimization-hotfix.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-source-owned-system-ui.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-update-center-v1-integration.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-update-center-v1-runtime-guard.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-update-center-v2-integration.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-installer-auto-reboot-hotfix.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-installed-mechscope-launch-hotfix.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-vm-mode-runtime-final.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-firstboot-session-authority.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-vm-app-launch-final.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-reference-splash-integration.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-plymouth-boot-final.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-finalize-install-payload.sh final' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-new-build-final-hardening.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-new-build-final-gate.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-build113-live-boot-splash-fix.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-build118-six-regression-final.sh' scripts/build-mechos-archiso.sh
          grep -Fq 'mechos-build119-vm-mechscope-final.sh' scripts/build-mechos-archiso.sh
          grep -qxF 'partitionmanager' scripts/build-mechos-archiso.sh
          grep -Fq 'kdialog partitionmanager firefox' scripts/build-mechos-archiso.sh
          grep -Fq 'Session=plasma' scripts/build-mechos-archiso.sh

      - name: Build MechOS ISO
        run: ./build-iso.sh

      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          ISO="$(find out -maxdepth 2 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          test -s "$ISO"
          test -s "$ISO.sha256"
          cd "$(dirname "$ISO")"
          sha256sum -c "$(basename "$ISO").sha256"
          ls -lh "$(basename "$ISO")" "$(basename "$ISO").sha256"

      - name: Upload MechOS ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechOS-v0.3.0-hotfix.2-x86_64
          path: |
            out/**/*.iso
            out/**/*.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
