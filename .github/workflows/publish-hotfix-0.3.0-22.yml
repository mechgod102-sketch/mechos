name: Publish MechOS v0.3.0 Hotfix 22

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/mechos_ui/creator_real_icons_v22.py'
      - 'scripts/mechos-creator-real-icons-owner-v22-patch.py'
      - 'scripts/mechos-mode-launch-v19.sh'
      - 'scripts/mechos-shell-route-v19.sh'
      - 'scripts/mechos-update-helper-v19.sh'
      - 'scripts/mechos-hotfix-0.3.0-22-apply.sh'
      - 'scripts/build-hotfix-0.3.0-22.sh'
      - 'scripts/validate-hotfix-0.3.0-22.sh'
      - '.github/workflows/publish-hotfix-0.3.0-22.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-22-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Build and validate Hotfix 22
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-22.sh
          bash scripts/build-hotfix-0.3.0-22.sh
          BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.22-update.tar.zst
          (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
          CONTENTS="$(tar --zstd -tf "$BUNDLE")"
          grep -Fxq './usr/local/share/mechos/ui/creator_real_icons_v22.py' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-creator-real-icons-owner-v22-patch' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-22-apply' <<< "$CONTENTS"
          for n in 15 16 17 18 19 20 21; do
            grep -Fxq "./usr/local/libexec/mechos-hotfix-0.3.0-${n}-apply" <<< "$CONTENTS"
          done
          grep -Fxq './usr/local/bin/mechos-mode-launch' <<< "$CONTENTS"
          grep -Fxq './usr/local/bin/mechos-shell-route' <<< "$CONTENTS"
          grep -Fxq './usr/local/bin/mechos-update-helper' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix21-unified-store-patch' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-update-transaction-v14' <<< "$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-update-transaction-core-v20' <<< "$CONTENTS"
      - name: Publish Hotfix 22 to Update Center stable channel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('updates/stable.json').read_text())
          assert data['version']=='0.3.0-hotfix.22', data
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.22-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.22-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 22 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 22'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git reset --hard HEAD
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Hotfix 22 after three synchronized attempts.' >&2
          exit 1
