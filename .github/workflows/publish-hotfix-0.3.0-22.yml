name: Publish MechOS v0.3.0 Hotfix 22.6

# Legacy publisher retained only for an explicit maintenance rebuild.
# Newer hotfixes share several MechScope/Creator source files with 22.6, so an
# automatic push trigger here can race a newer publisher and roll stable back.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-22-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Validate Hotfix 22.6 source
        run: |
          set -euo pipefail
          bash scripts/validate-hotfix-0.3.0-22.sh

      - name: Publish Hotfix 22.6 to Update Center stable channel
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Never allow this legacy maintenance publisher to replace a newer
            # stable channel. This check runs BEFORE build-hotfix-0.3.0-22.sh,
            # because that builder intentionally rewrites updates/stable.json.
            decision="$(python3 - <<'PY'
          import json, re
          from pathlib import Path

          target=(0, 3, 0, 22, 6)
          p=Path('updates/stable.json')
          if not p.is_file():
              print('ALLOW')
              raise SystemExit
          data=json.loads(p.read_text(encoding='utf-8'))
          value=str(data.get('version',''))
          m=re.fullmatch(r'(\d+)\.(\d+)\.(\d+)-hotfix\.(\d+)(?:\.(\d+))?', value)
          if not m:
              print('ALLOW')
              raise SystemExit
          current=tuple(int(x or 0) for x in m.groups())
          print('BLOCK_ROLLBACK' if current > target else 'ALLOW')
          PY
            )"
            if [ "$decision" = BLOCK_ROLLBACK ]; then
              echo 'A newer stable hotfix is already published; refusing 22.6 rollback.'
              exit 0
            fi

            bash scripts/validate-hotfix-0.3.0-22.sh
            bash scripts/build-hotfix-0.3.0-22.sh

            BUNDLE=updates/bundles/MechOS-0.3.0-hotfix.22.6-update.tar.zst
            (cd "$(dirname "$BUNDLE")" && sha256sum -c "$(basename "$BUNDLE").sha256")
            CONTENTS="$(tar --zstd -tf "$BUNDLE")"

            grep -Fxq './usr/local/libexec/mechos-update-center-v8.py' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-update-center-v8-rescue.py' <<< "$CONTENTS"
            grep -Fxq './usr/local/share/mechos/ui/creator_real_icons_v22.py' <<< "$CONTENTS"
            grep -Fxq './usr/local/share/mechos/ui/mechscope_reference_compat_v25.py' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-creator-real-icons-owner-v22-patch' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-mechscope-runtime-v23' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-22-apply' <<< "$CONTENTS"
            for n in 15 16 17 18 19 20 21; do
              grep -Fxq "./usr/local/libexec/mechos-hotfix-0.3.0-${n}-apply" <<< "$CONTENTS"
            done
            grep -Fxq './usr/local/bin/mechos-mode-launch' <<< "$CONTENTS"
            grep -Fxq './usr/local/bin/mechos-shell-route' <<< "$CONTENTS"
            grep -Fxq './usr/local/bin/mechos-update-helper' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-hotfix21-unified-store-patch' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-update-transaction-v13' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-update-transaction-v14' <<< "$CONTENTS"
            grep -Fxq './usr/local/libexec/mechos-update-transaction-core-v20' <<< "$CONTENTS"

            python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('updates/stable.json').read_text())
          assert data['version']=='0.3.0-hotfix.22.6', data
          PY

            git add \
              updates/bundles/MechOS-0.3.0-hotfix.22.6-update.tar.zst \
              updates/bundles/MechOS-0.3.0-hotfix.22.6-update.tar.zst.sha256 \
              updates/stable.json

            if git diff --cached --quiet; then
              echo 'Hotfix 22.6 is already published.'
              exit 0
            fi

            git commit -m 'Publish MechOS v0.3.0 Hotfix 22.6'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Publish race on attempt ${attempt}; rebuilding from latest main."
            sleep $((attempt * 2))
          done

          echo 'Unable to publish Hotfix 22.6 after three synchronized rebuild attempts.' >&2
          exit 1
