name: Validate MechOS Hotfix 31

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/mechos-mechscope-safe-launch-v31.sh'
      - 'scripts/mechos-session-autostart-v31.sh'
      - 'scripts/mechos-hotfix-0.3.0-31-apply.sh'
      - 'scripts/build-hotfix-0.3.0-31.sh'
      - 'scripts/validate-hotfix-0.3.0-31.sh'
      - 'scripts/mechos-tutorial-postinstall-guard.sh'
      - '.github/workflows/validate-hotfix-0.3.0-31.yml'
      - '.github/workflows/publish-hotfix-31.yml'
  push:
    branches:
      - 'hotfix/0.3.0-31-public-mechscope-python-wrapper'

permissions:
  contents: read

concurrency:
  group: validate-mechos-hotfix-31-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hotfix-31:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Validate Hotfix 31 source contracts
        run: bash scripts/validate-hotfix-0.3.0-31.sh
      - name: Build cumulative Hotfix 31 bundle
        run: bash scripts/build-hotfix-0.3.0-31.sh
      - name: Validate Hotfix 31 bundle
        run: |
          set -euo pipefail
          B=updates/bundles/MechOS-0.3.0-hotfix.31-update.tar.zst
          test -s "$B"
          test -s "$B.sha256"
          (cd updates/bundles && sha256sum -c MechOS-0.3.0-hotfix.31-update.tar.zst.sha256)
          CONTENTS="$(tar --zstd -tf "$B")"
          grep -Fxq './usr/local/libexec/mechos-mechscope-safe-launch-v31' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-session-autostart-v31' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-31-apply' <<<"$CONTENTS"
          grep -Fxq './usr/lib/systemd/system/mechos-hotfix-0.3.0-31.service' <<<"$CONTENTS"
          grep -Fxq './usr/local/libexec/mechos-hotfix-0.3.0-30-apply' <<<"$CONTENTS"
          rm -rf /tmp/hf31-check && mkdir -p /tmp/hf31-check
          tar --zstd -xpf "$B" -C /tmp/hf31-check
          grep -Fq 'MECHOS_MECHSCOPE_SAFE_LAUNCH_V31' /tmp/hf31-check/usr/local/libexec/mechos-mechscope-safe-launch-v31
          grep -Fq 'exec /usr/bin/python3 "$target" "$@"' /tmp/hf31-check/usr/local/libexec/mechos-mechscope-safe-launch-v31
          grep -Fq 'MECHOS_SESSION_AUTOSTART_V31' /tmp/hf31-check/usr/local/libexec/mechos-session-autostart-v31
          grep -Fq 'MECHOS_HOTFIX31_PUBLIC_MECHSCOPE_PYTHON_WRAPPER_V1' /tmp/hf31-check/usr/local/libexec/mechos-hotfix-0.3.0-31-apply
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=Path('updates/bundles/MechOS-0.3.0-hotfix.31-update.tar.zst')
          d=json.loads(Path('updates/stable.json').read_text())
          assert d['channel']=='stable'
          assert d['version']=='0.3.0-hotfix.31'
          assert d['requires_reboot'] is True
          assert hashlib.sha256(b.read_bytes()).hexdigest()==d['bundle_sha256']
          PY
